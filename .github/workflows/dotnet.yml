name: TTA Engine CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for better SonarCloud analysis

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'services/video-analyzer/pyproject.toml'

      - name: Install Python video-analyzer dependencies
        run: |
          python -m pip install --only-binary :all: -e "./services/video-analyzer[dev]"

      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner --version 12.1.0

      - name: Begin Sonar Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet-sonarscanner begin /k:"HlibBondarev_TTA-backend" /o:"hlibbondarev" \
          /d:sonar.token="$SONAR_TOKEN" \
          /d:sonar.host.url="https://sonarcloud.io" \
          /d:sonar.cs.opencover.reportsPaths="**/TestResults/**/coverage.opencover.xml" \
          /d:sonar.python.coverage.reportPaths="services/video-analyzer/coverage.xml" \
          /d:sonar.python.version="3.12" \
          /d:sonar.exclusions="**/Program.cs,**/Startup.cs,**/TTA.DataAccess/Models/**,**/*.sql,**/services/video-analyzer/.venv/**,**/services/video-analyzer/**/__pycache__/**,**/services/video-analyzer/**/*.egg-info/**,**/services/video-analyzer/build/**,**/services/video-analyzer/dist/**" \
          /d:sonar.coverage.exclusions="**/Program.cs,**/Startup.cs,**/TTA.DataAccess/Models/**,**/*.sql,**/services/video-analyzer/tests/**" \
          /d:sonar.cpd.exclusions="**/Controllers/MatchesController.cs,**/services/video-analyzer/tests/**" \
          /d:sonar.lang.patterns.plsql="**/*.not_exists" \
          /d:sonar.lang.patterns.tsql="**/*.sql"

      - name: Restore dependencies
        run: dotnet restore TTA-backend.sln

      - name: Build projects
        run: dotnet build TTA-backend.sln --no-restore

      - name: Configure Linux inotify limits
        run: sudo sysctl -w fs.inotify.max_user_instances=1024

      - name: Run tests with coverage
        env:
          DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE: "false"
        run: |
          dotnet test TTA-backend.sln --no-build --verbosity normal \
          --collect:"XPlat Code Coverage" \
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Lint Python video-analyzer (Ruff)
        run: |
          ruff check services/video-analyzer
          ruff format --check services/video-analyzer

      - name: Run Python video-analyzer tests with coverage
        env:
          GEMINI_API_KEY: ""
        run: |
          pytest services/video-analyzer \
            -c services/video-analyzer/pyproject.toml \
            --cov=services/video-analyzer/src/video_analyzer \
            --cov-report=xml:services/video-analyzer/coverage.xml

      - name: End Sonar Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"