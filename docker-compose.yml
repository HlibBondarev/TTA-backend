services:
  tta-db:
    image: postgres:16
    container_name: tta-postgres-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - tta_postgres_new_data:/var/lib/postgresql/data

volumes:
  tta_postgres_new_data: